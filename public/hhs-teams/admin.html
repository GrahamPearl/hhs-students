<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/cards.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <title>Activity Teams – Admin</title>
</head>
<body data-page="admin">
  <header class="topbar">
    <div class="title"><i class="fa-solid fa-user-shield"></i>Activity Teams · Admin</div>
    <button id="jsonExportBtn" class="btn btn-sm btn-outline-light" title="Export team JSON"><i class="fa-solid fa-file-export"></i></button>
    <button id="jsonImportBtn" class="btn btn-sm btn-outline-light" title="Import team JSON"><i class="fa-solid fa-file-import"></i></button>
    <button id="excelBtn" class="btn btn-sm btn-outline-light" title="Export team to Excel"><i class="fa-solid fa-file-excel"></i></button>
    <button id="activityReportBtn" class="btn btn-sm btn-outline-light" title="All students' activity report (Excel)"><i class="fa-solid fa-clipboard-list"></i></button>
    <button id="templateBtn" class="btn btn-sm btn-outline-light" title="Upload Word template"><i class="fa-solid fa-file-word"></i></button>
    <input type="file" id="templateFileInput" accept=".docx" hidden>
    <a href="teams.html" class="btn btn-sm btn-light"><i class="fa-solid fa-arrow-left"></i> Teams</a>
  </header>
  <div class="bar">
    <label for="activitySelect">Activity</label>
    <select id="activitySelect" class="form-select form-select-sm w-auto"></select><button id="addActivityBtn" class="btn btn-sm btn-outline-success" title="Add activity"><i class="fa-solid fa-plus"></i></button><button id="delActivityBtn" class="btn btn-sm btn-outline-danger" title="Delete activity"><i class="fa-solid fa-trash"></i></button>
    <label for="agegroupSelect" class="ms-2">Age group</label>
    <select id="agegroupSelect" class="form-select form-select-sm w-auto"></select><button id="addAgeBtn" class="btn btn-sm btn-outline-success" title="Add age group"><i class="fa-solid fa-plus"></i></button><button id="delAgeBtn" class="btn btn-sm btn-outline-danger" title="Delete age group"><i class="fa-solid fa-trash"></i></button>
    <span class="grow"></span>
    <span id="teamHeading"></span><span id="memberCount" class="d-none"></span><span id="genderStats" class="d-flex gap-1"></span>
  </div>
  <div class="bar">
    <input id="adminInput" class="form-control form-control-sm" style="width:140px" placeholder="Admin No">
    <button id="addBtn" class="btn btn-success btn-sm"><i class="fa-solid fa-user-plus"></i> Add</button>
    <button id="bulkBtn" class="btn btn-secondary btn-sm"><i class="fa-solid fa-users"></i> Bulk add</button>
    <button id="removeBtn" class="btn btn-danger btn-sm"><i class="fa-solid fa-user-minus"></i> Remove</button>
    <span class="grow"></span>
    <input id="rosterSearch" class="form-control form-control-sm" style="width:180px" placeholder="Search roster…">
    <label for="reportFormat">Format</label>
    <select id="reportFormat" class="form-select form-select-sm w-auto"><option value="docx">Word</option><option value="pdf">PDF</option><option value="both">Both</option></select>
    <button id="printOneBtn" class="btn btn-outline-primary btn-sm"><i class="fa-solid fa-file-word"></i> Print report</button>
    <label for="gradeFilter">Grade</label>
    <select id="gradeFilter" class="form-select form-select-sm w-auto"><option value="ALL">All</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select>
    <button id="printAllBtn" class="btn btn-primary btn-sm"><i class="fa-solid fa-print"></i> Print all (zip)</button>
  </div>
  <div id="roster"></div>
  <div class="sync-strip"><button id="saveBtn" class="btn btn-sm btn-primary"><i class="fa-solid fa-cloud-arrow-up"></i> Save now</button><span id="syncPill" class="sync-pill pill-idle">Cloud ready</span><span style="flex:1"></span>
    <span id="unsavedDot" class="d-none"><i class="fa-solid fa-circle" style="font-size:.5rem"></i> Unsaved changes (auto-saving…)</span></div>
  <div id="imageModal" class="image-modal"><img id="modalImage" alt=""></div>
  <div id="toastContainer"></div>
  <input type="file" id="importFileInput" accept=".json" hidden>
  <div class="modal fade" id="bulkAddModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Bulk add admin numbers</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><p class="text-muted small">Paste a comma, space or newline separated list.</p>
      <textarea id="bulkInput" class="form-control" rows="6" placeholder="15332, 14944, 15216…"></textarea></div>
    <div class="modal-footer"><button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
      <button id="bulkConfirm" class="btn btn-sm btn-success">Add to roster</button></div></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/admin-page.js"></script>
</body></html>
