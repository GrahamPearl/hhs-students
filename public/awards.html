<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hillcrest — Team Awards</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/awards.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="crest" aria-hidden="true">HHS</div>
      <div>
        <h1 class="site-title">Team Awards</h1>
        <p class="site-subtitle">RECOMMEND &amp; APPROVE</p>
      </div>
      <div class="header-spacer"></div>
      <a href="index.html" class="staff-link">Student lookup</a>
      <div id="userBadge" class="user-badge"></div>
      <button id="signOutBtn" class="btn btn-ghost btn-on-dark">Sign out</button>
    </div>
  </header>

  <main class="page page-narrow">

    <!-- Auth gate -->
    <section id="authGate" class="panel">
      <h2 class="panel-title">Staff sign in</h2>
      <p class="panel-hint">Awards can only be recommended or approved by authorised staff.</p>
      <form id="authForm" class="auth-form">
        <div>
          <label for="authEmail">Email</label>
          <input type="email" id="authEmail" required autocomplete="username" />
        </div>
        <div>
          <label for="authPassword">Password</label>
          <input type="password" id="authPassword" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>
      <p id="authError" class="error-text"></p>
    </section>

    <!-- Tool -->
    <div id="toolPanel" class="is-hidden">

      <section class="panel">
        <h2 class="panel-title">1. Recommend an award</h2>
        <form id="recommendForm" novalidate>
          <label for="studentSearch">Student</label>
          <input type="text" id="studentSearch" placeholder="Name or admin number…" autocomplete="off" />
          <div id="studentMatches" class="match-list"></div>
          <div id="selectedStudent" class="selected-student"></div>

          <div class="form-grid">
            <div>
              <label for="teamSelect">Team</label>
              <select id="teamSelect"></select>
            </div>
            <div>
              <label for="levelSelect">Award level</label>
              <select id="levelSelect"></select>
            </div>
          </div>

          <label for="noteInput">Note (optional) <span id="noteCount" class="note-count"></span></label>
          <textarea id="noteInput" rows="3" maxlength="300"></textarea>

          <p id="recommendError" class="error-text"></p>
          <p id="recommendStatus" class="ok-text"></p>
          <button type="submit" class="btn btn-primary">Submit recommendation</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-row">
          <h2 class="panel-title">2. Recommendations</h2>
          <button type="button" id="refreshBtn" class="btn btn-ghost">Refresh</button>
        </div>
        <div class="tab-row" role="tablist">
          <button type="button" class="tab is-active" data-status="pending">Pending</button>
          <button type="button" class="tab" data-status="confirmed">Confirmed</button>
          <button type="button" class="tab" data-status="rejected">Declined</button>
          <button type="button" class="tab" data-status="all">All</button>
        </div>
        <div id="recList" class="rec-list"></div>
      </section>

    </div>
  </main>

  <script src="js/config.js"></script>
  <script type="module" src="js/awards-app.js"></script>
</body>
</html>
